[package]
name             = "xdg-user-dirs"
version          = "0.20"
description      = "Creates the standard user folders (Documents, Downloads, Pictures, ...)"
license          = "GPL-2.0-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://www.freedesktop.org/wiki/Software/xdg-user-dirs/"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["musl", "gettext"]
provides         = ["xdg-user-dirs"]
tags             = ["base", "desktop"]

[install]
bin     = "/overlayer/syshub/bin"
lib     = "/overlayer/syshub/lib"
etc     = "/overlayer/syshub/etc"
share   = "/overlayer/syshub/share"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
