[package]
name             = "libXft"
version          = "2.3.8"
description      = "X11 client library libXft"
license          = "MIT"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://www.x.org"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["libX11", "libXrender", "freetype", "fontconfig"]
provides         = ["libXft"]
tags             = ["x11", "library"]

[install]
lib     = "/overlayer/syshub/lib"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []
