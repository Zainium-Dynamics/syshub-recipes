# libffi-dev.manifest.toml — libffi (userland development tier)

[package]
name             = "libffi-dev"
version          = "3.7.1"
description      = "libffi — development headers, static library, pkgconfig"
license          = "MIT"
maintainer       = "Ali Zain <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/libffi/libffi"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

requires_syshub  = ""
depends          = ["libffi"]
provides         = ["libffi.a", "ffi.h"]
tags             = ["library", "ffi", "development"]

[install]
lib     = "/overlayer/zexlib/union/lib"
include = "/overlayer/zexlib/union/include"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
