[package]
name             = "libdaemon-dev"
version          = "0.14"
description      = "libdaemon headers and pkgconfig"
license          = "LGPL-2.1-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://0pointer.de/lennart/projects/libdaemon/"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["libdaemon"]
provides         = ["libdaemon-dev"]
tags             = ["base", "library", "daemon", "dev"]

[install]
include = "/overlayer/zexlib/union/include"
lib     = "/overlayer/zexlib/union/lib"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []
