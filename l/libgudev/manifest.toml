[package]
name             = "libgudev"
version          = "238"
description      = "GObject bindings for libudev (device enumeration and hotplug for UPower and others)"
license          = "LGPL-2.1-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://gitlab.gnome.org/GNOME/libgudev"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["musl", "glib", "systemd"]
provides         = ["libgudev", "libgudev-1.0"]
tags             = ["base", "hardware"]

[install]
lib     = "/overlayer/syshub/lib"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
