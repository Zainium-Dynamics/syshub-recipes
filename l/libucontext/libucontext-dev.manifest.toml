[package]
name             = "libucontext-dev"
version          = "1.5.2"
description      = "libucontext headers, pkgconfig"
license          = "ISC"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/kaniini/libucontext"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["libucontext"]
provides         = ["libucontext-dev"]
