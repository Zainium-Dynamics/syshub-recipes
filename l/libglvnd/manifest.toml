[package]
name             = "libglvnd"
version          = "1.7.0"
description      = "GL vendor-neutral dispatch: libOpenGL, libEGL, libGLESv2"
license          = "MIT"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://gitlab.freedesktop.org/glvnd/libglvnd"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["musl"]
provides         = ["libglvnd", "libopengl", "libegl", "libglesv2"]
tags             = ["base", "graphics", "gpu", "opengl", "vulkan"]

[install]
lib     = "/overlayer/syshub/lib"
share   = "/overlayer/syshub/share"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
