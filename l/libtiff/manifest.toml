[package]
name             = "libtiff"
version          = "4.7.0"
description      = "TIFF image format library"
license          = "libtiff"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "http://www.simplesystems.org/libtiff/"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["zlib", "libjpeg-turbo"]
provides         = ["libtiff"]
tags             = ["base", "library", "image", "tiff"]

[install]
lib     = "/overlayer/syshub/lib"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []
