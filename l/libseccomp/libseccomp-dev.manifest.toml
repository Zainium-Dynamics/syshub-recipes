[package]
name             = "libseccomp-dev"
version          = "2.6.1"
description      = "libseccomp headers, static lib, pkgconfig"
license          = "LGPL-2.1-only"
maintainer       = "Ali Zain <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/seccomp/libseccomp"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["libseccomp"]
provides         = ["libseccomp-dev"]
tags             = ["base", "library", "security", "dev"]

[install]
include = "/overlayer/zexlib/union/include"
lib     = "/overlayer/zexlib/union/lib"
bin     = "/overlayer/zexlib/union/bin"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
