# manifest.toml — libgcrypt-dev
# See substrate's USAGE.md for the full field reference.

[package]
name             = "libgcrypt-dev"
version          = "1.12.2"
description      = "libgcrypt headers, pkgconfig"
license          = "LGPL-2.1-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://www.gnupg.org/software/libgcrypt/"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

requires_syshub  = ""
depends          = ["libgcrypt"]
provides         = ["libgcrypt-dev"]
tags             = ["library", "gnupg", "crypto", "dev"]

[install]
bin     = "/overlayer/syshub/bin"
include = "/overlayer/syshub/include"
lib     = "/overlayer/syshub/lib"
share   = "/overlayer/syshub/share"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
