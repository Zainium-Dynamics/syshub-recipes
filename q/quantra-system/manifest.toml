# manifest.toml — quantra-system (syshub tier)

[package]
name             = "quantra-system"
version          = "6.0.1"
description      = "Zainium OS core engine — init/service manager & network stack"
license          = "MIT"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/Zainium-Dynamics/Quantra-System"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["musl"]
provides         = [
    "quantra", "quantra-ctl", "systemctl", "quantra-net", "quantra-netd",
    "quantra-logind", "quantra-logindctl", "libqlogind"
]
tags             = ["base", "init", "network"]

[install]
engine  = "/overlayer/syshub/engine"
bin     = "/overlayer/syshub/bin"
lib     = "/overlayer/syshub/lib"
include = "/overlayer/syshub/include"
etc     = "/overlayer/syshub/etc"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
