[package]
name             = "iana-etc"
version          = "20261027"
description      = "IANA's network service names and protocol numbers (etc/services, etc/protocols)"
license          = "MIT"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/Mic92/iana-etc"
build_type       = "noarch"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = []
provides         = ["iana-etc", "services", "protocols"]
tags             = ["base", "network"]

[install]
etc     = "/overlayer/syshub/etc"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
