# manifest.toml — oxidized-environment (syshub tier)

[package]
name             = "oxidized-environment"
version          = "1.0.0"
description      = "Zainium OS environment resolver CLI (oxienv.toml)"
license          = "MIT"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/Zainium-Dynamics/oxidized-environment"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["musl"]
provides         = ["oxidized-environment"]
tags             = ["base", "environment"]

[install]
bin     = "/overlayer/syshub/bin"
etc     = "/overlayer/syshub/etc"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
