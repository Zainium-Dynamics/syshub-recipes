[package]
name             = "pkgconf"
version          = "3.0.5"
description      = "pkg-config compatible metadata toolkit"
license          = "ISC"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/pkgconf/pkgconf"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = []
provides         = ["pkgconf", "pkg-config"]
tags             = ["base", "toolchain"]

[install]
lib     = "/overlayer/syshub/lib"
bin     = "/overlayer/syshub/bin"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
