# zstd-dev.manifest.toml — zstd (userland development tier)

[package]
name             = "zstd-dev"
version          = "1.5.7"
description      = "Zstandard compression — development headers, static library, pkgconfig"
license          = "BSD-3-Clause"
maintainer       = "Ali Zain <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/facebook/zstd"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

requires_syshub  = ""
depends          = ["zstd"]
provides         = ["libzstd.a", "zstd.h"]
tags             = ["compression", "library", "development"]

[install]
lib     = "/overlayer/zexlib/union/lib"
include = "/overlayer/zexlib/union/include"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
