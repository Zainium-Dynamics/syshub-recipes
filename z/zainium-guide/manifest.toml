# manifest.toml — zainium-guide (syshub tier)

[package]
name             = "zainium-guide"
version          = "1.0.0"
description      = "Zainium Guide: how to use Zainium OS, with every command ready to copy"
license          = "GPL-3.0-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/Zainium-Dynamics/zainium-guide"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["musl", "mesa", "wayland", "libxkbcommon"]
provides         = ["zainium-guide"]
tags             = ["base", "desktop", "documentation"]

[install]
bin     = "/overlayer/syshub/bin"
share   = "/overlayer/syshub/share"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
