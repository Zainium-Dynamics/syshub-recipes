[package]
name             = "gcc-musl"
version          = "16.2.0"
description      = "GNU Compiler Collection (C, C++) for Zainium musl"
license          = "GPL-3.0-or-later WITH GCC-exception-3.1"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://gcc.gnu.org/"
build_type       = "dynamic"
libc_target      = "musl"
native           = true

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["musl", "binutils", "zlib", "zstd"]
provides         = ["gcc", "cc", "g++", "libstdc++", "libgcc"]
tags             = ["base", "toolchain", "compiler"]

[install]
bin     = "/overlayer/syshub/bin"
lib     = "/overlayer/syshub/lib"
libexec = "/overlayer/syshub/libexec"
include = "/overlayer/syshub/include"
share   = "/overlayer/syshub/share"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
