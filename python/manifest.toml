[package]
name             = "python"
version          = "3.14.8"
description      = "Python 3 interpreter"
license          = "PSF-2.0"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://www.python.org/"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["musl", "libffi", "expat", "openssl", "zlib", "bzip2", "xz", "readline", "ncurses", "util-linux", "sqlite"]
provides         = ["python"]
tags             = ["language", "runtime"]

[install]
bin     = "/overlayer/syshub/bin"
lib     = "/overlayer/syshub/lib"
share   = "/overlayer/syshub/share"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
