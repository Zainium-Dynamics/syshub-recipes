# manifest.toml — elevate-privilege (syshub tier)

[package]
name             = "elevate-privilege"
version          = "1.0.1"
description      = "sudo/su/shadow-utils/PAM replacement suite for Zainium OS"
license          = "MIT OR Apache-2.0"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/Zainium-Dynamics/elevate-privilege"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["musl"]
provides         = [
    "elevate", "elev", "vielev", "elevate-pam", "sudo",
    "libpam", "libelevate_pam", "unix_chkpwd",
    "useradd", "userdel", "usermod", "groupadd", "groupdel", "groupmod",
    "passwd", "chpasswd", "chgpasswd", "chage", "chfn", "chsh", "pwck",
    "grpck", "vipw", "umbra-sign", "gpasswd", "newusers", "groupmems",
    "nologin", "expiry", "pwconv", "pwunconv", "grpconv", "grpunconv",
    "newgrp", "faillog", "sulogin"
]
tags             = ["base", "security", "auth"]

[install]
bin     = "/overlayer/syshub/bin"
sbin    = "/overlayer/syshub/sbin"
lib     = "/overlayer/syshub/lib"
etc     = "/overlayer/syshub/etc"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
