[package]
name             = "cups-filters-dev"
version          = "1.28.17"
description      = "cups-filters headers and pkgconfig (libcupsfilters, libppd)"
license          = "GPL-2.0-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://openprinting.github.io/cups-filters"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["cups-filters"]
provides         = ["cups-filters-dev"]
tags             = ["base", "printing", "dev"]

[install]
include = "/overlayer/zexlib/union/include"
lib     = "/overlayer/zexlib/union/lib"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []
