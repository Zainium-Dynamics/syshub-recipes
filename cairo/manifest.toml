[package]
name             = "cairo"
version          = "1.18.4"
description      = "2D graphics library with support for multiple output devices"
license          = "LGPL-2.1-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://www.cairographics.org/"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["pixman", "fontconfig", "freetype", "glib"]
provides         = ["cairo"]
tags             = ["base", "library", "graphics", "gnome"]

[install]
lib     = "/overlayer/syshub/lib"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
