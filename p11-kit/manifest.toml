[package]
name             = "p11-kit"
version          = "0.26.5"
description      = "PKCS#11 module loading library"
license          = "BSD-3-Clause"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/p11-glue/p11-kit"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["musl", "libtasn1"]
provides         = ["p11-kit"]
tags             = ["base", "library", "crypto"]

[install]
bin     = "/overlayer/syshub/bin"
lib     = "/overlayer/syshub/lib"
etc     = "/overlayer/syshub/etc"
libexec = "/overlayer/syshub/libexec"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
