[package]
name             = "udisks2"
version          = "2.11.2"
description      = "Disk manager daemon: mounts USB drives and disks for the logged-in user"
license          = "GPL-2.0-or-later AND LGPL-2.0-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/storaged-project/udisks"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["glib", "polkit", "libgudev", "eudev", "libblockdev", "util-linux", "acl", "systemd"]
provides         = ["udisks2"]
tags             = ["base", "system", "storage"]

[install]
bin     = "/overlayer/syshub/bin"
lib     = "/overlayer/syshub/lib"
libexec = "/overlayer/syshub/libexec"
etc     = "/overlayer/syshub/etc"
share   = "/overlayer/syshub/share"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []
