[package]
name             = "sqlite-dev"
version          = "3.54.0"
description      = "SQLite headers, pkgconfig"
license          = "blessing"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://www.sqlite.org/"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["sqlite"]
provides         = ["sqlite-dev"]
tags             = ["base", "database", "dev"]

[install]
include = "/overlayer/zexlib/union/include"
lib     = "/overlayer/zexlib/union/lib"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
