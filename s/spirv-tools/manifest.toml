[package]
name             = "spirv-tools"
version          = "2026.3"
description      = "API/tools for processing SPIR-V modules"
license          = "Apache-2.0"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/KhronosGroup/SPIRV-Tools"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["musl"]
provides         = ["SPIRV-Tools", "spirv-val", "spirv-opt", "spirv-dis", "spirv-as", "spirv-link", "spirv-cfg", "spirv-reduce"]
tags             = ["base", "graphics", "library"]

[install]
bin     = "/overlayer/syshub/bin"
lib     = "/overlayer/syshub/lib"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
