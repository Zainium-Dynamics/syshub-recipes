[package]
name             = "at-spi2-core-dev"
version          = "2.62.1"
description      = "at-spi2-core, atk and atk-bridge headers, pkgconfig"
license          = "LGPL-2.1-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://gitlab.gnome.org/GNOME/at-spi2-core"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["at-spi2-core"]
provides         = ["at-spi2-core-dev", "atk-dev", "at-spi2-atk-dev"]
tags             = ["base", "accessibility", "dev"]

[install]
include = "/overlayer/zexlib/union/include"
lib     = "/overlayer/zexlib/union/lib"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
