[package]
name             = "at-spi2-core"
version          = "2.62.1"
description      = "Accessibility bus and libraries: at-spi-bus-launcher, libatspi, atk, atk-bridge"
license          = "LGPL-2.1-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://gitlab.gnome.org/GNOME/at-spi2-core"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["musl", "glib", "dbus", "libxml2", "systemd", "gsettings-desktop-schemas"]
provides         = ["at-spi2-core", "atk", "at-spi2-atk", "libatspi"]
tags             = ["base", "desktop", "accessibility"]

[install]
lib     = "/overlayer/syshub/lib"
libexec = "/overlayer/syshub/libexec"
etc     = "/overlayer/syshub/etc"
share   = "/overlayer/syshub/share"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
