[package]
name             = "ffmpeg"
version          = "9.0.2"
description      = "Audio and video codec libraries (LGPL build) and the ffmpeg, ffprobe tools"
license          = "LGPL-2.1-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://ffmpeg.org"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["musl", "zlib", "dav1d"]
provides         = ["ffmpeg", "ffprobe", "libavcodec", "libavformat", "libavutil", "libswscale", "libswresample", "libavfilter", "libavdevice"]
tags             = ["base", "library", "video", "codec"]

[install]
lib     = "/overlayer/syshub/lib"
bin     = "/overlayer/syshub/bin"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
