[package]
name             = "font-ibm-plex-mono"
version          = "2.5.0"
description      = "IBM Plex Mono, Zainium's default monospace font"
license          = "OFL-1.1"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/IBM/plex"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = []
provides         = ["font-ibm-plex-mono"]
tags             = ["base", "fonts"]

[install]
share   = "/overlayer/syshub/share"
etc     = "/overlayer/syshub/etc"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
