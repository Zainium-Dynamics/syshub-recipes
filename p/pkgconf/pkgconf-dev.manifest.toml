[package]
name             = "pkgconf-dev"
version          = "3.0.5"
description      = "pkgconf headers, pkgconfig"
license          = "ISC"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/pkgconf/pkgconf"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["pkgconf"]
provides         = ["pkgconf-dev"]
tags             = ["base", "toolchain", "dev"]

[install]
include = "/overlayer/zexlib/union/include"
lib     = "/overlayer/zexlib/union/lib"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
