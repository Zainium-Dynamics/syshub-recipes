[package]
name             = "poppler"
version          = "24.09.0"
description      = "PDF rendering library (libpoppler, libpoppler-cpp)"
license          = "GPL-2.0-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://poppler.freedesktop.org"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["fontconfig", "freetype", "libjpeg-turbo", "libpng", "libtiff", "zlib"]
provides         = ["poppler"]
tags             = ["base", "library", "pdf", "printing"]

[install]
lib     = "/overlayer/syshub/lib"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []
