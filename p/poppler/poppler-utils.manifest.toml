[package]
name             = "poppler-utils"
version          = "24.09.0"
description      = "poppler command-line tools (pdftops, pdfinfo, …) used by the printing stack"
license          = "GPL-2.0-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://poppler.freedesktop.org"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["poppler"]
provides         = ["poppler-utils", "pdftops"]
tags             = ["base", "pdf", "printing", "utils"]

[install]
bin     = "/overlayer/syshub/bin"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []
