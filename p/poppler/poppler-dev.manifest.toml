[package]
name             = "poppler-dev"
version          = "24.09.0"
description      = "poppler headers, pkgconfig and cmake files"
license          = "GPL-2.0-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://poppler.freedesktop.org"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["poppler"]
provides         = ["poppler-dev"]
tags             = ["base", "library", "pdf", "dev"]

[install]
include = "/overlayer/zexlib/union/include"
lib     = "/overlayer/zexlib/union/lib"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []
