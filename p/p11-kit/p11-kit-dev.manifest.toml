[package]
name             = "p11-kit-dev"
version          = "0.26.5"
description      = "p11-kit headers, pkgconfig"
license          = "BSD-3-Clause"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/p11-glue/p11-kit"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["p11-kit"]
provides         = ["p11-kit-dev"]
tags             = ["base", "dev"]

[install]
include = "/overlayer/zexlib/union/include"
lib     = "/overlayer/zexlib/union/lib"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
