[package]
name             = "qpdf"
version          = "11.9.1"
description      = "PDF content transformation library (libqpdf)"
license          = "Apache-2.0"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://qpdf.sourceforge.io"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["zlib", "libjpeg-turbo"]
provides         = ["qpdf"]
tags             = ["base", "library", "pdf", "printing"]

[install]
lib     = "/overlayer/syshub/lib"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []
