[package]
name             = "qpdf-dev"
version          = "11.9.1"
description      = "qpdf headers, pkgconfig and cmake files"
license          = "Apache-2.0"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://qpdf.sourceforge.io"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["qpdf"]
provides         = ["qpdf-dev"]
tags             = ["base", "library", "pdf", "dev"]

[install]
include = "/overlayer/zexlib/union/include"
lib     = "/overlayer/zexlib/union/lib"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []
