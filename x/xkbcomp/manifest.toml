[package]
name             = "xkbcomp"
version          = "1.4.7"
description      = "X11 client application xkbcomp"
license          = "MIT"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://www.x.org"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["libX11", "libxkbfile"]
provides         = ["xkbcomp"]
tags             = ["x11", "library"]

[install]
bin     = "/overlayer/syshub/bin"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []
