[package]
name             = "xcb-util-cursor"
version          = "0.1.5"
description      = "X11 client library xcb-util-cursor"
license          = "MIT"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://www.x.org"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["libxcb", "xcb-util-image", "xcb-util-renderutil"]
