[package]
name             = "xdg-utils"
version          = "1.3.0_rc1"
description      = "Desktop integration scripts: xdg-open, xdg-mime, xdg-settings and more"
license          = "MIT"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://gitlab.freedesktop.org/xdg/xdg-utils"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["shared-mime-info"]
provides         = ["xdg-utils", "xdg-open", "xdg-mime"]
tags             = ["base", "desktop", "utility"]

[install]
bin     = "/overlayer/syshub/bin"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
