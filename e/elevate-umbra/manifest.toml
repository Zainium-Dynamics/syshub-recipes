[package]
name             = "elevate-umbra"
version          = "1.0.1"
description      = "shadow-utils replacement in Rust: useradd, passwd, groupadd and the rest"
license          = "MIT OR Apache-2.0"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/Zainium-Dynamics/elevate-umbra"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["musl"]
provides         = [
    "elevate-umbra", "shadow",
    "useradd", "userdel", "usermod", "newusers",
    "groupadd", "groupdel", "groupmod", "gpasswd", "groupmems", "newgrp",
    "passwd", "chpasswd", "chgpasswd", "chage", "expiry",
    "chfn", "chsh", "nologin", "pwck", "grpck", "vipw", "umbra-sign",
    "pwconv", "pwunconv", "grpconv", "grpunconv", "sulogin", "faillog", "sudo",
]
tags             = ["base", "security", "auth"]

[install]
bin     = "/overlayer/syshub/bin"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
