[package]
name             = "dbus-dev"
version          = "1.16.0"
description      = "D-Bus headers, pkgconfig"
license          = "AFL-2.1 OR GPL-2.0-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://www.freedesktop.org/wiki/Software/dbus/"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["dbus"]
provides         = ["dbus-dev"]
tags             = ["base", "ipc", "dev"]

[install]
include = "/overlayer/zexlib/union/include"
lib     = "/overlayer/zexlib/union/lib"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
