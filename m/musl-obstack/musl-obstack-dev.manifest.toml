[package]
name             = "musl-obstack-dev"
version          = "1.2.3"
description      = "musl-obstack headers, pkgconfig"
license          = "GPL-2.0-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/void-linux/musl-obstack"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["musl-obstack"]
provides         = ["musl-obstack-dev"]
tags             = ["base", "libs", "dev"]

[install]
include = "/overlayer/zexlib/union/include"
lib     = "/overlayer/zexlib/union/lib"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
