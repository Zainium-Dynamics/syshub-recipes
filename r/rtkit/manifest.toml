[package]
name             = "rtkit"
version          = "0.14"
description      = "RealtimeKit: realtime scheduling for PipeWire and WirePlumber over D-Bus"
license          = "GPL-3.0-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://gitlab.freedesktop.org/pipewire/rtkit"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["musl", "dbus", "libcap", "systemd"]
provides         = ["rtkit", "rtkit-daemon"]
tags             = ["base", "audio"]

[install]
bin     = "/overlayer/syshub/bin"
lib     = "/overlayer/syshub/lib"
libexec = "/overlayer/syshub/libexec"
share   = "/overlayer/syshub/share"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
