[package]
name             = "fribidi"
version          = "1.0.17"
description      = "Unicode Bidirectional Algorithm library (right-to-left text for pango)"
license          = "LGPL-2.1-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/fribidi/fribidi"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["musl"]
provides         = ["fribidi", "libfribidi"]
tags             = ["base", "text"]

[install]
lib     = "/overlayer/syshub/lib"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
