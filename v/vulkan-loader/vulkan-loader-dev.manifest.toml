[package]
name             = "vulkan-loader-dev"
version          = "1.4.363.0"
description      = "Vulkan headers, libvulkan.so, pkgconfig and cmake files"
license          = "Apache-2.0"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/KhronosGroup/Vulkan-Loader"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["vulkan-loader"]
provides         = ["vulkan-loader-dev", "vulkan-headers"]
tags             = ["base", "graphics", "library", "dev"]

[install]
include = "/overlayer/zexlib/union/include"
lib     = "/overlayer/zexlib/union/lib"
share   = "/overlayer/zexlib/union/share"
_syshub = false

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
