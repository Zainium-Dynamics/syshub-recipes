# manifest.toml — cosmic-bg (syshub tier)

[package]
name             = "cosmic-bg"
version          = "1.11.0"
description      = "COSMIC wallpaper daemon, systemd/dbus/flatpak free"
license          = "MPL-2.0"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/pop-os/cosmic-bg"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = []
provides         = ["cosmic-bg"]
tags             = ["desktop", "cosmic"]

[install]
bin     = "/overlayer/syshub/bin"
share   ="/overlayer/syshub/share"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
