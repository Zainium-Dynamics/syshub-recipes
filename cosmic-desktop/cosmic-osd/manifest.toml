# manifest.toml — cosmic-osd (syshub tier)

[package]
name             = "cosmic-osd"
version          = "1.11.0"
description      = "COSMIC on-screen-display daemon, systemd/dbus/flatpak free"
license          = "GPL-3.0-or-later"
maintainer       = "Ali Zain <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/pop-os/cosmic-osd"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = []
provides         = ["cosmic-osd"]
tags             = ["desktop", "cosmic"]

[install]
bin     = "/overlayer/syshub/bin"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
