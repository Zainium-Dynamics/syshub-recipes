# manifest.toml — cosmic-idle (userland tier)

[package]
name             = "cosmic-idle"
version          = "1.11.0"
description      = "Idle daemon for the COSMIC Desktop Environment"
license          = "GPL-3.0-only"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/pop-os/cosmic-idle"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["cosmic-icons"]
provides         = ["cosmic-idle"]
tags             = ["desktop", "cosmic"]

[install]
bin     = "/overlayer/syshub/bin"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
