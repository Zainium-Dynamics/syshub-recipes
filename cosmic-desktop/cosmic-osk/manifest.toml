[package]
name             = "cosmic-osk"
version          = "1.11.0"
description      = "On-screen keyboard for the COSMIC Desktop Environment"
license          = "GPL-3.0-only"
maintainer       = "Zainium <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/pop-os/cosmic-osk"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = []
provides         = ["cosmic-osk"]
tags             = ["desktop", "cosmic", "accessibility"]

[install]
bin     = "/overlayer/syshub/bin"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
