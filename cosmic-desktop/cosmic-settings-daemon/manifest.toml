# manifest.toml — cosmic-settings-daemon (syshub tier)

[package]
name             = "cosmic-settings-daemon"
version          = "1.11.0"
description      = "COSMIC settings daemon, systemd/dbus/flatpak free"
license          = "GPL-3.0-only"
maintainer       = "Ali Zain <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/pop-os/cosmic-settings-daemon"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = []
provides         = ["cosmic-settings-daemon"]
tags             = ["desktop", "cosmic"]

[install]
bin     = "/overlayer/syshub/bin"
share   = "/overlayer/syshub/share"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
