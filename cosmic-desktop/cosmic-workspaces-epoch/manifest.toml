# manifest.toml — cosmic-workspaces-epoch (userland tier)

[package]
name             = "cosmic-workspaces-epoch"
version          = "1.11.0"
description      = "Workspace component for the COSMIC Desktop Environment"
license          = "GPL-3.0-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/pop-os/cosmic-workspaces-epoch"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["cosmic-icons"]
provides         = ["cosmic-workspaces-epoch", "cosmic-workspaces"]
tags             = ["desktop", "cosmic"]

[install]
bin     = "/overlayer/syshub/bin"
share   = "/overlayer/syshub/share"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
