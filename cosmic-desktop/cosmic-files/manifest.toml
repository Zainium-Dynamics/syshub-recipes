# manifest.toml — cosmic-files (userland tier)

[package]
name             = "cosmic-files"
version          = "1.11.0"
description      = "File browser for the COSMIC Desktop Environment"
license          = "GPL-3.0-only"
maintainer       = "Zainium <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/pop-os/cosmic-files"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["cosmic-icons", "xdg-utils", "shared-mime-info"]
provides         = ["cosmic-files"]
tags             = ["desktop", "cosmic", "app"]

[install]
bin     = "/overlayer/syshub/bin"
share   = "/overlayer/syshub/share"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
