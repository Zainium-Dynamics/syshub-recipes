# manifest.toml — cosmic-term (userland tier)

[package]
name             = "cosmic-term"
version          = "1.11.0"
description      = "Terminal emulator for the COSMIC Desktop Environment, with Zainium oxienv resolution"
license          = "GPL-3.0-only"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/pop-os/cosmic-term"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = []
provides         = ["cosmic-term"]
tags             = ["desktop", "cosmic", "app"]

[install]
bin     = "/overlayer/syshub/bin"
share   = "/overlayer/syshub/share"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
