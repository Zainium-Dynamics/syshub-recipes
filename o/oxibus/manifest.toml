# manifest.toml — oxibus (syshub tier)

[package]
name             = "oxibus"
version          = "0.1.0"
description      = "Zainium OS's own D-Bus message bus implementation"
license          = "GPL-3.0-only"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/Zainium-Dynamics/oxibus"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["musl"]
provides         = [
    "oxibus-daemon", "oxibus-send", "oxibus-monitor", "oxibus-launch",
    "oxibus-uuidgen", "oxibus-cleanup-sockets", "oxibus-run-session",
    "oxibus-update-activation-environment"
]
tags             = ["base", "ipc", "message-bus"]

[install]
bin     = "/overlayer/syshub/bin"
libexec = "/overlayer/syshub/libexec"
lib     = "/overlayer/syshub/lib"
etc     = "/overlayer/syshub/etc"
engine  = "/overlayer/syshub/engine"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
