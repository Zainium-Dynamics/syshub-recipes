# manifest.toml — libfyaml
# See substrate's USAGE.md for the full field reference.

[package]
name             = "libfyaml"
version          = "0.9.5"
description      = "Fully featured YAML 1.2 parser and emitter"
license          = "MIT"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/pantoniou/libfyaml"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

requires_syshub  = ""
depends          = ["musl"]
provides         = ["libfyaml"]
tags             = ["library", "yaml"]

[install]
bin     = "/overlayer/syshub/bin"
lib     = "/overlayer/syshub/lib"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
