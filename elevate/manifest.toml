# manifest.toml — elevate (syshub tier)

[package]
name             = "elevate"
version          = "1.0.1"
description      = "elevate / elev / vielev — memory-safe sudo/su for Zainium OS"
license          = "MIT OR Apache-2.0"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/Zainium-Dynamics/elevate"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["musl"]
provides         = ["elevate", "elev", "vielev", "sudo"]
tags             = ["base", "security", "auth"]

[install]
bin     = "/overlayer/syshub/bin"
sbin    = "/overlayer/syshub/sbin"
etc     = "/overlayer/syshub/etc"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
