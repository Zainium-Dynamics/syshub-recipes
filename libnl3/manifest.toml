[package]
name             = "libnl3"
version          = "3.12.0"
description      = "Netlink protocol library"
license          = "LGPL-2.1-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://github.com/thom311/libnl"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["musl"]
provides         = ["libnl3"]
tags             = ["base", "library", "network"]

[install]
bin     = "/overlayer/syshub/bin"
sbin    = "/overlayer/syshub/sbin"
lib     = "/overlayer/syshub/lib"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
