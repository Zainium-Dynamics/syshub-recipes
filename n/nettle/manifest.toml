[package]
name             = "nettle"
version          = "4.0"
description      = "Low-level cryptographic library"
license          = "LGPL-3.0-or-later"
maintainer       = "Zainium Dynamics <alizain@zainiumdynamics.tech>"
homepage         = "https://www.lysator.liu.se/~nisse/nettle/"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["musl", "gmp"]
provides         = ["nettle"]
tags             = ["base", "library", "crypto"]

[install]
lib     = "/overlayer/syshub/lib"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
